<ellipse cx="400" cy="686" rx="230" ry="34" fill="url(#floor)"/>
<circle cx="400" cy="390" r="255" fill="url(#steelDark)" stroke="#3f4653" stroke-width="3"/>
  <circle cx="400" cy="390" r="212" fill="url(#steel)" stroke="#5b6474" stroke-width="3"/>
  <circle cx="400" cy="390" r="168" fill="url(#ball)" stroke="#454d5c" stroke-width="3"/>
  <circle cx="400" cy="390" r="96" fill="#191d25"/>
  <circle cx="400" cy="390" r="96" fill="url(#steelDark)" opacity=".55"/>
  <circle cx="400" cy="390" r="96" fill="none" stroke="#39404d" stroke-width="4"/>
  <path d="M 232 390 a 168 168 0 0 1 336 0" fill="none" stroke="#ffffff" stroke-width="16" opacity=".35"/>
  <ellipse cx="308" cy="290" rx="52" ry="30" fill="#ffffff" opacity=".5" transform="rotate(-30 308 290)"/>
  <circle cx="400" cy="157" r="15" fill="#20252f"/>
</svg>
